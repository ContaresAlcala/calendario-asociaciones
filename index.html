<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendario Interasociaciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px; /* Reducido para pantallas pequeñas */
            background-color: #f4f7f6;
            color: #333;
            -webkit-font-smoothing: antialiased;
        }
        #top-bar {
            width: 100%;
            max-width: 1050px;
            margin: 10px auto 15px auto;
            text-align: center;
            box-sizing: border-box;
        }
        h1 { 
            margin-bottom: 5px; 
            font-size: 1.8rem; /* Tamaño responsivo para el título */
        }
        p {
            font-size: 0.95rem;
            margin: 5px 0;
            color: #666;
        }
        /* Contenedor adaptativo optimizado para móvil y PC */
        .calendar-wrapper {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            overflow: hidden;
            box-sizing: border-box;
        }
        iframe {
            width: 100%;
            height: 80vh; /* Utiliza el 80% de la altura real de la pantalla del móvil */
            min-height: 550px; /* Evita que se colapse en pantallas muy pequeñas */
            border: none;
            display: block;
        }
        
        /* Ajustes específicos para pantallas de móviles (menos de 600px de ancho) */
        @media (max-width: 600px) {
            body {
                padding: 5px; /* Aprovecha el espacio al máximo en móviles */
            }
            #top-bar {
                margin: 5px auto 10px auto;
            }
            h1 {
                font-size: 1.4rem; /* Título un poco más compacto en teléfonos */
            }
            .calendar-wrapper {
                border-radius: 4px; /* Bordes más sutiles en pantallas pequeñas */
            }
            iframe {
                height: 82vh; /* Un poco más alto en móviles para reducir scroll interno */
            }
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <h1>Calendario de Actividades</h1>
        <p>Eventos programados por las asociaciones alcalaínas</p>
    </div>

    <!-- Contenedor optimizado con tu nueva ID de SpreadSimple -->
    <div class="calendar-wrapper">
        <iframe 
            src="https://flgdkvl.spread.name" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads">
        </iframe>
    </div>

</body>
</html>
